[project]
name = "fastapi-startkit"
version = "0.52.0"
description = "A modular, provider-driven framework for building async Python web applications with FastAPI — bundling a service container, configuration system, an async-first ORM, facades, and a Cleo-powered console."
readme = "README.md"
keywords = [
    "fastapi",
    "framework",
    "async",
    "web",
    "asgi",
    "orm",
    "sqlalchemy",
    "pydantic",
    "ioc-container",
    "dependency-injection",
    "service-provider",
    "cli",
    "console",
    "configuration",
    "microservices",
    "starter-kit",
    "boilerplate",
]
authors = [
    {name = "Bedram Tamang", email = "tmgbedu@gmail.com"}
]
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "dotty-dict>=1.3.1",
    "pendulum (>=3.1.0,<4.0.0)",
    "inflection>=0.5.1",
    "requests (>=2.32.5,<3.0.0)",
    "cleo>=2.1.0,<3.0.0",
    "dotenv>=0.9.9",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://fastapi-startkit.github.io"
Documentation = "https://fastapi-startkit.github.io"
Repository = "https://github.com/fastapi-startkit/fastapi-startkit-framework"
Issues = "https://github.com/fastapi-startkit/fastapi-startkit-framework/issues"
Changelog = "https://github.com/fastapi-startkit/fastapi-startkit-framework/releases"

[project.optional-dependencies]
fastapi = [
    "fastapi[standard]>=0.124.4",
    "itsdangerous>=2.2.0",
]
database = [
    "faker>=40.13.0",
    "sqlalchemy[asyncio]>=2.0.38",
]

sqlite = [
    "aiosqlite>=0.22.1"
]

postgres = [
    "asyncpg>=0.29.0",
]

mysql = [
    "aiomysql>=0.2.0",
]

vite=[
    "jinja2>=3.1",
]

inertia = [
    "jinja2>=3.1",
    "markupsafe>=2.0",
]

ai = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
]

[dependency-groups]
dev = [
    "dumpdie>=1.5.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "twine>=6.2.0",
    "itsdangerous>=2.2.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.22.1",
    "aiomysql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "fastapi[standard]>=0.124.4",
    "faker>=40.13.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "pyright>=1.1.411",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F401"]
fixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src/fastapi_startkit"]
exclude = [
    "**/tests",
    "**/migrations",
    "**/*.backup",
    "**/*_backup",
    "**/__pycache__",
    "**/.venv",
]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = [".venv", "dist", "build", "__pycache__"]

[tool.coverage.run]
source = ["src/fastapi_startkit"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*.pyi",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["uv_build >= 0.10.10, <0.11.0"]
build-backend = "uv_build"

[tool.uv]
workspace = { members = ["application", "example/*"] }
