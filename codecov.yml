coverage:
  status:
    project:
      default:
        target: auto
        threshold: 100%
        informational: true
    patch:
      default:
        informational: true

flags:
  fastapi_startkit:
    paths:
      - fastapi_startkit/src/fastapi_startkit/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
