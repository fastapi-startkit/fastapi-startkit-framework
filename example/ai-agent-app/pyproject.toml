[project]
name = "ai-agent-app"
version = "0.1.0"
description = "AI Agent app built with FastAPI Startkit + Inertia.js + React"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.1",
    "fastapi-startkit[fastapi]",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
fastapi-startkit = { path = "../../fastapi_startkit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
